<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <style>
      .scroll { stroke: #6B0B22; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .check { stroke: #D62828; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dot-fill { fill: #D62828; }
    </style>
  </defs>

  <!-- Scroll body - main rectangle -->
  <path class="scroll" d="
    M 340 120
    L 340 310
    Q 340 340, 370 340
    L 470 340
    Q 500 340, 500 310
    L 500 140
    Q 500 110, 470 110
    L 370 110
    Q 350 110, 340 130
  "/>

  <!-- Top-left curl -->
  <path class="scroll" d="
    M 340 130
    Q 330 105, 310 110
    Q 295 115, 300 135
    Q 305 150, 320 150
  "/>

  <!-- Bottom-right curl upward and inward -->
  <path class="scroll" d="
    M 500 310
    Q 520 320, 525 300
    Q 530 285, 515 275
    Q 505 268, 500 280
  "/>

  <!-- Checkmark inside scroll -->
  <path class="check" d="
    M 385 240
    L 410 265
    L 455 215
  "/>

  <!-- Floating circle above top-right -->
  <circle class="dot-fill" cx="500" cy="85" r="14"/>

  <!-- Typography -->
  <text x="400" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif" font-size="56" letter-spacing="8" fill="#6B0B22">
    <tspan font-weight="800">DOT</tspan>
    <tspan font-weight="200" letter-spacing="12">  DEED</tspan>
  </text>
</svg>
